[package]
name = "dictionary"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "A portable, themeable dictionary with an offline English edition and Wiktionary editions in 23 languages"

[[bin]]
name = "dictionary"
path = "src/main.rs"

[dependencies]
gpui-kit = { version = "=0.6.6", default-features = false, features = ["assets"] }
gpui-omarchy = "0.1.3"
flate2 = "1"
notify = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
gpui-kit = { version = "=0.6.6", default-features = false, features = ["assets", "test-support"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
